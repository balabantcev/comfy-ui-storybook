name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test Storybook
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tokens match the Figma snapshot
        run: pnpm check:tokens

      - name: Every component links to its Figma node
        run: pnpm check:figma-links

      - name: Generate design tokens
        run: pnpm gen:tokens

      - name: Generated tokens.css is committed
        run: git diff --exit-code -- src/foundations/tokens.css

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run component / interaction / a11y tests
        run: pnpm test

      - name: Build Storybook
        run: pnpm build-storybook

  chromatic:
    name: Visual regression (Chromatic)
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    # Needs full git history for Chromatic baselines.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to Chromatic
        # Runs only when the token is configured (skips on forks without secrets).
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        run: pnpm dlx chromatic --exit-zero-on-changes
